<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Access Required</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #0f172a;
      padding: 2rem;
      border-radius: 1rem;
      width: 320px;
      text-align: center;
      border: 1px solid #1e293b;
    }
    h2 { font-size: 1.25rem; margin-bottom: 1rem; }
    input {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #06b6d4; }
    button {
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 0.5rem;
      background: #0891b2;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #06b6d4; }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { color: #f87171; font-size: 0.75rem; margin-top: 0.75rem; min-height: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Access Required</h2>
    <input id="pw" type="password" placeholder="Enter password" autocomplete="current-password" autofocus>
    <button id="btn">Enter</button>
    <p id="err" class="error"></p>
  </div>

  <script>
    const pw = document.getElementById('pw');
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');

    async function submit() {
      const password = pw.value.trim();
      if (!password) return;
      btn.disabled = true;
      err.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (res.ok) {
          // Cookie is set; the app is now reachable.
          window.location.href = '/';
          return;
        }
        if (res.status === 429) {
          err.textContent = 'Too many attempts. Try again later.';
        } else {
          err.textContent = 'Wrong password';
        }
      } catch {
        err.textContent = 'Server error. Try again.';
      }
      btn.disabled = false;
    }

    btn.addEventListener('click', submit);
    pw.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  </script>
</body>
</html>
